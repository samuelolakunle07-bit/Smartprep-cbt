<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- App Rounded Squircle Background -->
  <rect width="512" height="512" rx="128" fill="url(#blueGrad)" />

  <!-- Background decorative pattern -->
  <circle cx="440" cy="80" r="140" fill="#ffffff" opacity="0.06" />
  <circle cx="60" cy="460" r="160" fill="#22c55e" opacity="0.1" />

  <!-- Computer CBT Screen Base Frame -->
  <g filter="url(#shadow)">
    <!-- Monitor Bezel -->
    <rect x="86" y="96" width="340" height="230" rx="20" fill="#0f172a" stroke="#ffffff" stroke-width="6" />
    
    <!-- Monitor Display Screen -->
    <rect x="102" y="112" width="308" height="198" rx="12" fill="#ffffff" />
    
    <!-- Screen Header Bar (Nigerian Green Accent) -->
    <rect x="102" y="112" width="308" height="34" rx="12" fill="url(#greenGrad)" />
    
    <!-- 3 Mini Dots for CBT UI -->
    <circle cx="124" cy="129" r="5" fill="#ffffff" opacity="0.8" />
    <circle cx="140" cy="129" r="5" fill="#ffffff" opacity="0.8" />
    <circle cx="156" cy="129" r="5" fill="#ffffff" opacity="0.8" />

    <!-- Screen CBT Content representation -->
    <!-- Question text bar -->
    <rect x="126" y="162" width="180" height="12" rx="6" fill="#1e293b" />
    <rect x="126" y="182" width="220" height="10" rx="5" fill="#64748b" opacity="0.6" />
    
    <!-- Radio Options -->
    <circle cx="136" cy="214" r="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2" />
    <rect x="154" y="210" width="100" height="8" rx="4" fill="#64748b" />

    <!-- Selected Radio Option (Green) -->
    <circle cx="136" cy="242" r="8" fill="#22c55e" />
    <circle cx="136" cy="242" r="4" fill="#ffffff" />
    <rect x="154" y="238" width="140" height="8" rx="4" fill="#0f172a" />

    <circle cx="136" cy="270" r="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2" />
    <rect x="154" y="266" width="90" height="8" rx="4" fill="#64748b" />

    <!-- Countdown Timer Badge on Screen -->
    <rect x="320" y="156" width="76" height="28" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" />
    <text x="358" y="175" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#dc2626" text-anchor="middle">01:45:00</text>

    <!-- Monitor Stand Base -->
    <path d="M 230 326 L 210 376 L 302 376 L 282 326 Z" fill="#334155" />
    <rect x="176" y="376" width="160" height="18" rx="9" fill="#0f172a" stroke="#ffffff" stroke-width="3" />
  </g>

  <!-- Golden / Green Graduation Cap & Success Badge Floating -->
  <g transform="translate(325, 290)" filter="url(#shadow)">
    <circle cx="50" cy="50" r="48" fill="url(#greenGrad)" stroke="#ffffff" stroke-width="5" />
    <!-- Checkmark -->
    <path d="M 34 50 L 46 62 L 68 38" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- SmartPrep Text Logo Accent at Bottom -->
  <text x="256" y="446" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">SMARTPREP</text>
  <text x="256" y="474" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#86efac" text-anchor="middle" letter-spacing="4">CBT NIGERIA</text>
</svg>
